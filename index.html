<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bar e Barber 27 | Fidelidade</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;padding:22px 16px;min-height:100vh;background:#080807;color:#f5eee0;font-family:Arial,sans-serif}
.card{max-width:480px;margin:20px auto;padding:28px 22px;border:1px solid #a88745;border-radius:22px;background:linear-gradient(145deg,#24211b,#090909);box-shadow:0 12px 35px #000}
.brand{text-align:center;color:#d6b66e;letter-spacing:4px;font-size:13px}
h1{text-align:center;color:#e5c77e;font-family:Georgia,serif;font-size:30px;margin:12px 0}
.sub{text-align:center;color:#c8bfae;margin-bottom:25px}
.line{border:0;border-top:1px solid #66532e;margin:22px 0}
h2{color:#d6b66e;font-size:19px}
input,button{width:100%;padding:14px;margin:7px 0;border-radius:9px;font-size:16px}
input{background:#171614;border:1px solid #66532e;color:white}
button{background:#b18b43;color:#100e09;border:0;font-weight:bold;cursor:pointer}
button.secondary{background:#29251d;color:#e8d6ad;border:1px solid #806637}
button:disabled{opacity:.4}
.stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin:20px 0}
.stamp{border:1px solid #987b43;border-radius:9px;text-align:center;padding:13px 2px;color:#d6b66e;font-size:21px}
.stamp.done{background:#a88745;color:#100e09}
.client{text-align:center;font-size:21px;font-weight:bold;margin:18px 0}
.small{text-align:center;color:#b9ad99;font-size:13px}
.item{border:1px solid #66532e;padding:12px;border-radius:9px;margin:10px 0}
.hidden{display:none}
#message{color:#e5c77e;text-align:center;white-space:pre-wrap}
</style>
</head>
<body>
<div class="card">
  <img src="95ba96a5cb5cc882ab23f67f6e3ae7c0788674842e3b847339279ba3f42a4aaa.png" alt="Logo Bar e Barber 27" style="width:180px;max-width:75%;height:auto;display:block;margin:0 auto 16px;">
  <div class="brand">BARBEARIA • PORTO ALEGRE</div>
  <h1>BAR E BARBER 27</h1>
  <div class="sub">CARTÃO FIDELIDADE</div>
  <hr class="line">

  <section id="customer" class="hidden">
    <div class="client" id="customerName"></div>
    <div class="small">SEUS CORTES PAGOS</div>
    <div class="stamps" id="stamps"></div>
    <h2 id="progress" style="text-align:center"></h2>
    <p id="reward" class="small"></p>
    

<a href="https://wa.me/5551992172691?text=Ol%C3%A1%21%20Gostaria%20de%20agendar%20um%20hor%C3%A1rio%20na%20Bar%20e%20Barber%2027.%0AMeu%20nome%3A%0AServi%C3%A7o%20desejado%3A%0ADia%20de%20prefer%C3%AAncia%3A%0AHor%C3%A1rio%20de%20prefer%C3%AAncia%3A"
target="_blank"
rel="noopener noreferrer"
style="display:block;background:#20b858;color:white;text-align:center;padding:15px;border-radius:10px;text-decoration:none;font-weight:bold;margin:20px 0;">
  Agendar meu horário
</a>

    <a href="https://wa.me/5551992172691?text=Ol%C3%A1%21%20Vim%20pelo%20meu%20cart%C3%A3o%20fidelidade."
   target="_blank"
   rel="noopener noreferrer"
   style="display:block;background:#20b858;color:white;text-align:center;padding:15px;border-radius:10px;text-decoration:none;font-weight:bold;margin:20px 0;">
  Fale com a Bar e Barber pelo WhatsApp
</a>

  </section>

  <section id="staffLogin" class="hidden">
    <h2>Área do barbeiro</h2>
    <input id="email" type="email" placeholder="E-mail do barbeiro">
    <input id="password" type="password" placeholder="Senha">
    <button onclick="login()">Entrar</button>
  </section>

  <section id="staffArea" class="hidden">
    <h2>Painel do barbeiro</h2>
    <button class="secondary" onclick="logout()">Sair</button>
    <hr class="line">
    <h2>Cadastrar cliente</h2>
    <input id="newName" placeholder="Nome do cliente">
    <input id="newPhone" placeholder="WhatsApp com DDD">
    <button onclick="registerClient()">Cadastrar cliente</button>
    <hr class="line">
    <h2>Clientes cadastrados</h2>
    <div id="clients"></div>
  </section>

  <p id="message"></p>
  <hr class="line">
  <div class="small">BAR E BARBER 27 • FIDELIDADE</div>
</div>

<script>
const SUPABASE_URL = "https://qrsmjbklyfviczmiftkl.supabase.co";
const SUPABASE_KEY = "sb_publishable_X9TJdzTxmLB7vb7BB44k-Q_QR0_wZjl";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);
function msg(text){ $("message").textContent=text; }

function show(id){
  ["customer","staffLogin","staffArea"].forEach(x=>$(x).classList.add("hidden"));
  $(id).classList.remove("hidden");
}

async function loadCard(token){
  show("customer");
  msg("Carregando cartão...");
  const {data,error}=await sb.rpc("get_loyalty_card",{p_card_token:token});
  if(error || !data || !data.length){
    msg("Não foi possível localizar este cartão.");
    return;
  }
  const c=data[0];
  $("customerName").textContent=c.client_name;
  $("stamps").innerHTML="";
  for(let i=1;i<=10;i++){
    const el=document.createElement("div");
    el.className="stamp"+(i<=c.cuts_count?" done":"");
    el.textContent=i<=c.cuts_count?"✓":"✂";
    $("stamps").appendChild(el);
  }
  $("progress").textContent=c.free_cut_available
    ?"Você conquistou seu corte grátis!"
    :`Você tem ${c.cuts_count} de 10 cortes pagos.`;
  $("reward").textContent=c.free_cut_available
    ?"Apresente este cartão ao barbeiro para resgatar seu corte completo grátis."
    :`Faltam ${c.cuts_remaining} cortes para ganhar um corte completo grátis.`;
  msg("");
}

async function login(){
  msg("Entrando...");
  const {error}=await sb.auth.signInWithPassword({
    email:$("email").value.trim(),
    password:$("password").value
  });
  if(error){msg("Falha no acesso: "+error.message);return;}
  await loadStaff();
}

async function logout(){
  await sb.auth.signOut();
  show("staffLogin");
  msg("Você saiu do painel.");
}

async function loadStaff(){
  const {data:{user}}=await sb.auth.getUser();
  if(!user){show("staffLogin");return;}
  const {data,error}=await sb.from("loyalty_staff")
    .select("user_id").eq("user_id",user.id).maybeSingle();
  if(error || !data){
    await sb.auth.signOut();
    show("staffLogin");
    msg("Usuário não autorizado.");
    return;
  }
  show("staffArea");
  msg("");
  await loadClients();
}

async function loadClients(){
  const {data,error}=await sb.from("loyalty_clients")
        .select("id,name,phone,cuts_count,card_token,is_active")
    .order("name");

  
  if(error){msg("Erro ao carregar clientes: "+error.message);return;}
  $("clients").innerHTML="";
  data.forEach(c=>{
    const item=document.createElement("div");
    item.className="item";
    const name=document.createElement("strong");
    name.textContent=c.name;
    const info=document.createElement("p");
    info.textContent=c.phone+" • "+c.cuts_count+"/10 cortes";
    const cardLink=location.origin+location.pathname+"?card="+c.card_token;
    const link=document.createElement("button");
    link.className="secondary";
    link.textContent="Copiar link do cartão";
    link.onclick=()=>navigator.clipboard.writeText(cardLink)
      .then(()=>msg("Link copiado!"));
    const whatsapp=document.createElement("button");
whatsapp.className="secondary";
whatsapp.textContent="Enviar cartão pelo WhatsApp";

const numero=c.phone.replace(/\D/g,"");
const numeroWhatsApp=numero.startsWith("55") ? numero : "55"+numero;

const mensagem=encodeURIComponent(
  `Olá, ${c.name}! 💈 Seu cartão fidelidade da Bar e Barber 27 está disponível. Acompanhe seus cortes e seu benefício neste link: ${cardLink}`
);

whatsapp.onclick=()=>{
  window.open(
    `https://wa.me/${numeroWhatsApp}?text=${mensagem}`,
    "_blank"
  );
};
        const edit=document.createElement("button");
    edit.className="secondary";
    edit.textContent="Editar cadastro";
    edit.onclick=()=>editClient(c.id,c.name,c.phone);
    const active=document.createElement("button");
active.className="secondary";
active.textContent=c.is_active?"Desativar cliente":"Reativar cliente";
active.onclick=()=>toggleClientActive(c.id,c.is_active);
    const paid=document.createElement("button");
    paid.textContent="Registrar corte pago";
    paid.disabled=!c.is_active || c.cuts_count>=10;
    paid.onclick=()=>registerPaid(c.id);
    const free=document.createElement("button");
    free.className="secondary";
    free.textContent="Resgatar corte grátis";
    free.disabled=!c.is_active || c.cuts_count!==10;
    free.onclick=()=>redeem(c.id);
    item.append(name,info,link,whatsapp,edit,active,paid,free);
    $("clients").appendChild(item);
  });
}
async function editClient(id,currentName,currentPhone){
  const name=prompt("Editar nome do cliente:",currentName);
  if(name===null)return;

  const phone=prompt("Editar WhatsApp com DDD:",currentPhone);
  if(phone===null)return;

  if(!name.trim() || !phone.trim()){
    msg("Nome e WhatsApp não podem ficar vazios.");
    return;
  }

  msg("Salvando alterações...");

  const {data,error}=await sb.from("loyalty_clients")
  .update({
    name:name.trim(),
    phone:phone.trim()
  })
  .eq("id",id)
  .select("id,name,phone");
  

  if(error){
    msg("Não foi possível editar: "+error.message);
    return;
  }
  if(!data || data.length===0){
  msg("Nenhum cadastro foi alterado. Verifique a autorização.");
  return;
  }

  msg("Cadastro atualizado com sucesso!");
  await loadClients();
}
async function toggleClientActive(id,isActive){
  const action=isActive?"desativar":"reativar";

  if(!confirm("Deseja "+action+" este cliente?"))return;

  const {error}=await sb.from("loyalty_clients")
    .update({is_active:!isActive})
    .eq("id",id);

  if(error){
    msg("Erro ao alterar cadastro: "+error.message);
    return;
  }

  msg("Cadastro atualizado com sucesso!");
  await loadClients();
}
  async function registerClient(){
  const name=$("newName").value.trim();
  const phone=$("newPhone").value.trim();
  if(!name || !phone){msg("Informe nome e WhatsApp.");return;}
  msg("Cadastrando...");
  const {data,error}=await sb.rpc("register_loyalty_client",{
    p_name:name,p_phone:phone
  });
  if(error){msg(error.message);return;}
  $("newName").value="";
  $("newPhone").value="";
  msg("Cliente cadastrado! Copie o link do cartão na lista.");
  await loadClients();
}

async function registerPaid(id){
  if(!confirm("Confirmar um corte pago para este cliente?"))return;
  const {data,error}=await sb.rpc("register_paid_cut",{p_client_id:id});
  if(error){msg(error.message);return;}
  msg("Corte registrado! Total: "+data+"/10.");
  await loadClients();
}

async function redeem(id){
  if(!confirm("Confirmar o resgate do corte completo grátis?"))return;
  const {error}=await sb.rpc("redeem_free_cut",{p_client_id:id});
  if(error){msg(error.message);return;}
  msg("Benefício resgatado! O cartão começou um novo ciclo.");
  await loadClients();
}

async function start(){
  const token=new URLSearchParams(location.search).get("card");
  if(token){await loadCard(token);return;}
  const {data:{session}}=await sb.auth.getSession();
  if(session) await loadStaff();
  else show("staffLogin");
}
start();
</script>
</body>
</html>
